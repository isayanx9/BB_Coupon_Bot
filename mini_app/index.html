<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131f">
  <title>BB Coupon Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <link rel="stylesheet" href="/mini/static/style.css">
</head>
<body>
  <main id="app">
    <div class="noise"></div><div class="glow glow-violet"></div><div class="glow glow-yellow"></div>
    <section id="loading" class="loading"><span class="logo-mark">BB</span><b>Loading your deals…</b><small>Secure coupon shop</small></section>
    <section id="shop" hidden>
      <header class="topbar">
        <div><p class="eyebrow">FLASHX · SECURE SHOP</p><h1>Hey, <span id="name">Friend</span> <i>✦</i></h1></div>
        <button class="avatar" id="profile-btn" aria-label="Profile">◉</button>
      </header>
      <section class="hero">
        <span class="hero-chip">⚡ LIVE SAVINGS</span><h2>Coupons, delivered<br><em>instantly.</em></h2>
        <p>Pay safely with Cashfree inside Telegram.</p><span class="hero-art">🎁</span>
      </section>
      <section class="quick-grid">
        <button class="quick violet" data-view="wallet"><span>🟣</span><b id="wallet">₹0</b><small>My wallet</small></button>
        <button class="quick yellow" data-view="orders"><span>🟡</span><b id="order-count">0</b><small>My orders</small></button>
        <button class="quick cyan" data-view="refer"><span>🔵</span><b id="referrals">0</b><small>Referrals</small></button>
      </section>
      <div class="section-heading"><div><p>HANDPICKED FOR YOU</p><h2>Live coupons</h2></div><span id="stock-label" class="live-dot">Live</span></div>
      <div id="coupons" class="coupon-grid"></div>
      <section id="view" class="sheet" hidden></section>
      <nav><button class="active" data-nav="home"><span>⌂</span><small>Home</small></button><button data-nav="orders"><span>▣</span><small>Orders</small></button><button data-nav="wallet"><span>◈</span><small>Wallet</small></button><button data-nav="support"><span>◌</span><small>Support</small></button></nav>
    </section>
  </main>
  <div id="toast"></div>
  <script src="/mini/static/app.js"></script>
</body>
</html>
