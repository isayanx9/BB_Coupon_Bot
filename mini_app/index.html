<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>BB Coupon Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <link rel="stylesheet" href="/mini/static/style.css">
  <link rel="stylesheet" href="/mini/static/pages.css">
  <link rel="stylesheet" href="/mini/static/fixes.css">
  <link rel="stylesheet" href="/mini/static/features.css">
  <link rel="stylesheet" href="/mini/static/qr.css">
</head>
<body>
  <main id="app">
    <div class="grid-noise"></div><div class="ambient ambient-violet"></div><div class="ambient ambient-gold"></div>
    <section id="loading" class="loading"><span class="brand-mark">BB</span><b>Loading your deals…</b><small>Secure Telegram checkout</small></section>
    <section id="shop" hidden>
      <header class="topbar">
        <button class="round-menu" id="profile-btn" aria-label="Profile">☰</button>
        <div class="brand"><b><em>BB</em> Coupon Shop</b><span></span></div>
        <div class="round-menu bell">♧</div>
      </header>
      <div id="home-content">
      <section class="hero-card">
        <div class="hero-copy"><span class="hero-label">⚡ LIVE SAVINGS</span><h1 class="glitch" data-text="Instant Savings">Instant <em>Savings</em></h1><p>Buy securely. Receive your code instantly.</p><button class="gold-cta" id="hero-buy">Buy now <b>→</b></button></div>
        <div class="ticket-art"><span>%</span></div>
      </section>
      <section class="quick-grid">
        <button class="quick cyan" data-view="home"><span>🎟</span><b id="stock-label">0</b><small>Available</small></button>
        <button class="quick violet" data-view="orders"><span>♧</span><b id="order-count">0</b><small>My Orders</small></button>
        <button class="quick gold" data-view="wallet"><span>▱</span><b id="wallet">₹0</b><small>Wallet</small></button>
      </section>
      <section class="coupon-header"><div><p>LIMITED DROP</p><h2>Live coupons</h2></div><button data-view="refer">🎁 Refer</button></section>
      <section id="flash-sales" class="flash-stack"></section>
      <div id="coupons" class="coupon-grid"></div>
      </div>
      <section id="page" class="full-page" hidden></section>
      <section id="view" class="sheet" hidden></section>
      <nav><button class="active" data-nav="home"><span>⌂</span><small>Home</small></button><button data-nav="orders"><span>▣</span><small>My Orders</small></button><button data-nav="wallet"><span>▱</span><small>Wallet</small></button><button data-nav="support"><span>◌</span><small>Support</small></button></nav>
    </section>
  </main>
  <div id="toast"></div>
  <script src="/mini/static/app.js?v=20260814-qr"></script>
  <script src="/mini/static/features.js"></script>
</body>
</html>
